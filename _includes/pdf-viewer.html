{% assign pdf_url = include.file | relative_url %}
{% assign pdf_height = include.height | default: "800px" %}
{% assign pdf_title = include.title | default: "PDF document" %}

<div class="pdf-viewer">
  <div class="pdf-viewer__open-card">
    <a href="{{ pdf_url }}" target="_blank" rel="noopener noreferrer">Open PDF</a>
  </div>
  <object data="{{ pdf_url }}" type="application/pdf" width="100%" height="{{ pdf_height }}" aria-label="{{ pdf_title }}">
    <p>
      Your browser cannot display this PDF.
      <a href="{{ pdf_url }}" target="_blank" rel="noopener noreferrer">Open PDF</a>.
    </p>
  </object>
</div>
