# Site configuration. Jekyll does not reload this file: restart `jekyll serve` after editing it.

# Site
title: Arthur Aguiar
description: I write about programming
email: aguiar99arthur@proton.me
github_username: aguiar-arthur
url: "https://aguiar-arthur.github.io"
baseurl: ""
lang: en
timezone: America/Sao_Paulo # dates without a zone mean the same instant locally and in CI
favicon: /favicon.ico
logo: /logo.png

# Licensing: code is MIT (LICENSE). The author's own writing is licensed as below; third-party material is not
# covered (every page says so by default, see _includes/footer.html and /license/).
content_license_name: CC BY 4.0
content_license_url: https://creativecommons.org/licenses/by/4.0/

# Build
theme: no-style-please # light only; light/dark is handled by assets/css/site.css
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: :compressed
plugins:
  - jekyll-feed

# Feeds: /feed.xml (posts) plus one per collection.
feed:
  collections:
    annotations:
      path: /annotations/feed.xml
    books:
      path: /books/feed.xml
    papers:
      path: /papers/feed.xml

# Content collections. URLs come from the file, so renaming a file changes its URL.
collections:
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/
  annotations:
    output: true
    permalink: /annotations/:path/
  books:
    output: true
    permalink: /books/:path/
  papers:
    output: true
    permalink: /papers/:path/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: post }
  - scope: { path: "", type: "annotations" }
    values: { layout: post }
  - scope: { path: "", type: "books" }
    values: { layout: post }
  - scope: { path: "", type: "papers" }
    values: { layout: post }

# Repository-only files that must not be published.
exclude:
  - docs/
  - bin/
  - tmp/
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - LICENSE            # also avoids a clash with the /license/ page on case-insensitive filesystems (macOS)
  - LICENSE-CONTENT.md
