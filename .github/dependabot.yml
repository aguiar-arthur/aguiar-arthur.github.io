version: 2
updates:
  # One grouped pull request per ecosystem and week instead of one per dependency.
  # Major versions stay separate so they can be reviewed on their own.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      gems:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      actions:
        update-types: ["minor", "patch"]
