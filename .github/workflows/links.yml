name: Check external links

# External URLs change and rate-limit, so they are checked on a schedule instead of
# blocking every deploy. A failed run is the signal that a link needs attention.
on:
  schedule:
    - cron: "17 12 * * 1" # Mondays 12:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --source ./ --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Install html-proofer
        run: gem install html-proofer --version '~> 5.0' --no-document

      - name: Check links (including external)
        run: ruby bin/check-site --external
