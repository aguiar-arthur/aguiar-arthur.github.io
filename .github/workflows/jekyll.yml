name: Build and deploy Jekyll site

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:  # Allows you to trigger the workflow manually from the Actions tab

# Least privilege by default; only the deploy job gets more.
permissions:
  contents: read

# One run per branch/PR. A new push to a pull request cancels its previous run; runs on main are never
# cancelled (the deploy has its own queue, see the deploy job).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests: Minitest for _includes/, node:test + jsdom for assets/js (see docs/testing.md).
  # Runs in parallel with `build`; `deploy` needs both.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript test dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Test includes (Ruby)
        run: bundle exec rake test

      - name: Test assets/js (Node)
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check content
        run: ruby bin/check-content

      - name: Build with Jekyll
        run: bundle exec jekyll build --source ./ --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Install html-proofer
        run: gem install html-proofer --version '~> 5.0' --no-document

      - name: Check links and HTML references (internal)
        run: ruby bin/check-site

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]  # a failing test or build blocks the deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # publish to GitHub Pages
      id-token: write  # verify the deployment source
    concurrency:
      group: pages
      cancel-in-progress: false  # never interrupt a deployment in progress
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
