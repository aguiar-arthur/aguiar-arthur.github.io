---
layout: post
title: Categories
permalink: /posts/categories/
---
{% assign sorted_categories = site.categories | sort %}
<ul class="taxonomy-list">
  {% for category in sorted_categories %}
    <li>
      <h2>{{ category[0] }}</h2>
      <ul>
        {% for post in category[1] %}
          <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
        {% endfor %}
      </ul>
    </li>
  {% endfor %}
</ul>
